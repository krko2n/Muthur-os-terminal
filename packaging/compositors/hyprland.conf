# MUTHUR OS Terminal - Hyprland Desktop Integration Config
#
# PURPOSE: Run MUTHUR as a focused application within Hyprland desktop.
# This is NOT for kiosk mode. For kiosk, use cage via muthur-session.
#
# USAGE: Append to ~/.config/hypr/hyprland.conf or include via:
#   source = ~/.config/hypr/muthur.conf
#

# Window Rules - MUTHUR OS Terminal
# Force fullscreen with no decorations when launched
windowrulev2 = fullscreen, class:^(muthur-os-terminal)$
windowrulev2 = noborder, class:^(muthur-os-terminal)$
windowrulev2 = rounding 0, class:^(muthur-os-terminal)$
windowrulev2 = noblur, class:^(muthur-os-terminal)$
windowrulev2 = noshadow, class:^(muthur-os-terminal)$
windowrulev2 = opaque, class:^(muthur-os-terminal)$

# Eliminate gaps when MUTHUR is the only window on workspace
workspace = special:muthur, gapsout:0, gapsin:0, border:false

# Dedicated workspace for MUTHUR (optional)
# Bind MUTHUR to workspace 10 for dedicated focus
windowrulev2 = workspace 10 silent, class:^(muthur-os-terminal)$

# Workspace 10 configuration - no gaps, no borders
workspace = 10, gapsout:0, gapsin:0, border:false, default:false

# Keybind to launch MUTHUR (Super+M)
bind = $mainMod, M, exec, muthur-os-terminal --fullscreen-force

# Keybind to toggle MUTHUR fullscreen
bind = $mainMod SHIFT, M, fullscreen, 0

# Performance: disable animations for MUTHUR window
windowrulev2 = noanim, class:^(muthur-os-terminal)$

# Input: pass all keys to MUTHUR when focused (no compositor interception)
windowrulev2 = suppressevent maximize, class:^(muthur-os-terminal)$
