# MUTHUR OS Kiosk - Kernel Parameters
# Install to: /etc/sysctl.d/99-muthur-kiosk.conf
# Then run: sysctl --system
#
# WARNING: Disables kernel-level escape sequences.
# Recovery: Boot into GRUB recovery mode, remount rw, delete this file.

# Disable Magic SysRq key (prevents Alt+SysRq+* escape sequences)
kernel.sysrq = 0

# Restrict dmesg access to root only (prevents information leakage)
kernel.dmesg_restrict = 1

# Disable kernel module loading after boot (optional, uncomment for maximum security)
# kernel.modules_disabled = 1
