# MUTHUR OS Kiosk - systemd-logind Override
# Install to: /etc/systemd/logind.conf.d/muthur-kiosk.conf
# Then run: systemctl restart systemd-logind
#
# WARNING: This locks down the system for kiosk use.
# Recovery: Boot into GRUB recovery mode to reverse changes.

[Login]
# Disable automatic VT (getty) spawning - prevents TTY escape
NAutoVTs=0
ReserveVT=0

# Disable hardware power/suspend keys (managed by MUTHUR instead)
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
HandleSuspendKey=ignore
HandleSuspendKeyLongPress=ignore
HandleHibernateKey=ignore
HandleRebootKey=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore

# Session restrictions
KillUserProcesses=yes
RemoveIPC=yes

# Single session enforcement
SessionsMax=1
