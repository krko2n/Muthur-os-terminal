name: CI - Build and Test

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'examples/**'
      - '.github/workflows/version-update.yml'
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Build Check
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v5

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          curl \
          wget \
          file \
          libssl-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libwebkit2gtk-4.1-dev \
          libgl1-mesa-dev \
          libegl1-mesa-dev \
          xvfb \
          xorg-dev

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          src-tauri/target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Cache Node modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install NPM dependencies
      run: |
        if [ -f package-lock.json ]; then
          npm ci --legacy-peer-deps
        else
          npm install --legacy-peer-deps
        fi

    - name: Build frontend
      run: npm run build

    - name: Verify frontend build output
      run: |
        if [ ! -d dist ]; then
          echo "ERROR: Frontend build failed - dist/ directory not created"
          exit 1
        fi
        echo "Frontend build successful"
        ls -lh dist/

    - name: Build Tauri app (no bundle)
      working-directory: src-tauri
      run: xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" cargo build --release

    - name: Verify binary exists
      run: |
        BINARY_PATH="src-tauri/target/release/muthur-os-terminal"
        if [ ! -f "$BINARY_PATH" ]; then
          echo "ERROR: Binary not found at $BINARY_PATH"
          ls -la src-tauri/target/release/ || true
          exit 1
        fi
        echo "Binary built successfully"
        ls -lh "$BINARY_PATH"

  test:
    name: Tests and Lints
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v5

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          libssl-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libwebkit2gtk-4.1-dev \
          libgl1-mesa-dev \
          libegl1-mesa-dev

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          src-tauri/target/
        key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-test-

    - name: Install NPM dependencies
      run: |
        if [ -f package-lock.json ]; then
          npm ci --legacy-peer-deps
        else
          npm install --legacy-peer-deps
        fi

    - name: Check version consistency
      run: npm run version:check

    - name: Run frontend lint
      run: npm run lint

    - name: Check format hygiene
      run: npm run format:check

    - name: Check installer safety guards
      run: npm run installer:check

    - name: Check installer shell syntax
      run: |
        bash -n install.sh
        bash -n scripts/install.sh
        bash -n scripts/muthur-offline-pack.sh
        bash -n scripts/uninstall.sh

    - name: Exercise installer dry run
      run: ./install.sh --dry-run --prefix "$HOME/.local" --no-deps --no-ollama

    - name: Run project tests
      run: npm run test

    - name: Verify README counters
      run: npm run check:readme-stats

    - name: Build frontend (required for Tauri context macro)
      run: npm run build

    - name: Run Rust tests
      working-directory: src-tauri
      run: cargo test --no-fail-fast

    - name: Run Rust clippy
      working-directory: src-tauri
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Check Rust formatting
      working-directory: src-tauri
      run: cargo fmt -- --check

    - name: Check TypeScript
      run: npm run lint

  summary:
    name: CI Summary
    runs-on: ubuntu-22.04
    needs: [check, test]
    if: always()

    steps:
    - name: Check CI status
      run: |
        if [ "${{ needs.check.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ]; then
          echo "CI failed - check logs above"
          exit 1
        fi
        echo "All CI checks passed"
