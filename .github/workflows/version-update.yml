name: Update Version History

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.github/**'

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate version history
      run: |
        echo "# Version History" > VERSION_HISTORY.md
        echo "" >> VERSION_HISTORY.md
        echo "Auto-generated from git log." >> VERSION_HISTORY.md
        echo "" >> VERSION_HISTORY.md
        git log --oneline --no-merges -50 >> VERSION_HISTORY.md

    - name: Update README counters
      run: node scripts/update-readme-stats.cjs

    - name: Commit generated docs
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        if [ -f VERSION_HISTORY.md ]; then
          git add -f VERSION_HISTORY.md README.md
          if ! git diff --staged --quiet; then
            git commit -m "docs: auto-update generated docs [skip ci]"
            git push || echo "Push failed (likely branch protection) - skipping"
          fi
        fi
