name: Release - Build and Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    name: Build Release Artifacts
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v5

    - name: Determine version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ inputs.version }}"
        else
          VERSION="${GITHUB_REF#refs/tags/}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          curl \
          wget \
          file \
          libssl-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libwebkit2gtk-4.1-dev \
          libgl1-mesa-dev \
          libegl1-mesa-dev \
          x11-apps \
          xvfb \
          xorg-dev

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          src-tauri/target/
        key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-release-

    - name: Cache Node modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node-release-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-release-

    - name: Verify lockfiles exist
      run: |
        if [ ! -f package-lock.json ]; then
          echo "ERROR: package-lock.json is missing - cannot build release"
          exit 1
        fi
        if [ ! -f src-tauri/Cargo.lock ]; then
          echo "ERROR: Cargo.lock is missing - cannot build release"
          exit 1
        fi

    - name: Install NPM dependencies
      run: npm ci --legacy-peer-deps

    - name: Build frontend
      run: |
        echo "Building frontend..."
        npm run build
        echo "Frontend build complete"

    - name: Verify frontend build
      run: |
        if [ ! -d dist ]; then
          echo "ERROR: Frontend build failed"
          exit 1
        fi
        echo "Frontend dist/ size:"
        du -sh dist/

    - name: Build Tauri bundles
      run: |
        echo "Building Tauri bundles..."
        xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" npm run tauri build
        echo "Tauri build complete"

    - name: Verify build artifacts
      id: artifacts
      run: |
        echo "Checking for build artifacts..."

        # Find binary
        BINARY_PATH="src-tauri/target/release/muthur-os-terminal"
        if [ ! -f "$BINARY_PATH" ]; then
          echo "ERROR: Binary not found at $BINARY_PATH"
          ls -la src-tauri/target/release/ || true
          exit 1
        fi
        echo "binary_path=$BINARY_PATH" >> $GITHUB_OUTPUT

        # Find AppImage
        APPIMAGE_PATH=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" -type f | head -1)
        if [ -z "$APPIMAGE_PATH" ]; then
          echo "ERROR: AppImage not found"
          ls -la src-tauri/target/release/bundle/ || true
          exit 1
        fi
        echo "appimage_path=$APPIMAGE_PATH" >> $GITHUB_OUTPUT

        # Find Deb package
        DEB_PATH=$(find src-tauri/target/release/bundle/deb -name "*.deb" -type f | head -1)
        if [ -z "$DEB_PATH" ]; then
          echo "ERROR: Deb package not found"
          ls -la src-tauri/target/release/bundle/ || true
          exit 1
        fi
        echo "deb_path=$DEB_PATH" >> $GITHUB_OUTPUT

        echo "All artifacts found:"
        echo "  Binary: $BINARY_PATH"
        echo "  AppImage: $APPIMAGE_PATH"
        echo "  Deb: $DEB_PATH"

        # Show sizes
        ls -lh "$BINARY_PATH"
        ls -lh "$APPIMAGE_PATH"
        ls -lh "$DEB_PATH"

    - name: Make binary executable
      run: chmod +x src-tauri/target/release/muthur-os-terminal

    - name: Generate checksums
      run: |
        cd src-tauri/target/release/
        sha256sum muthur-os-terminal > SHA256SUMS
        cd bundle/appimage/
        sha256sum *.AppImage >> ../../../../SHA256SUMS
        cd ../deb/
        sha256sum *.deb >> ../../../../SHA256SUMS
        cd ../../../../
        echo "Checksums generated:"
        cat SHA256SUMS

    - name: Prepare release artifacts
      run: |
        mkdir -p release-artifacts
        cp src-tauri/target/release/muthur-os-terminal release-artifacts/
        cp src-tauri/target/release/bundle/appimage/*.AppImage release-artifacts/
        cp src-tauri/target/release/bundle/deb/*.deb release-artifacts/
        cp src-tauri/target/release/SHA256SUMS release-artifacts/

        echo "Release artifacts prepared:"
        ls -lh release-artifacts/

    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: muthur-linux-release-${{ steps.version.outputs.version }}
        path: release-artifacts/*
        if-no-files-found: error

    outputs:
      version: ${{ steps.version.outputs.version }}
      binary_path: ${{ steps.artifacts.outputs.binary_path }}
      appimage_path: ${{ steps.artifacts.outputs.appimage_path }}
      deb_path: ${{ steps.artifacts.outputs.deb_path }}

  create-release:
    name: Create GitHub Release
    needs: build-linux
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v5

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: muthur-linux-release-${{ needs.build-linux.outputs.version }}
        path: release-artifacts/

    - name: Create release notes
      id: release_notes
      run: |
        VERSION="${{ needs.build-linux.outputs.version }}"
        cat > release-notes.md << EOF
        # MUTHUR OS Terminal $VERSION

        ## Installation

        ### AppImage (Recommended - Universal Linux)
        \`\`\`bash
        # Download the AppImage
        wget https://github.com/krko2n/Muthur-os-terminal/releases/download/$VERSION/muthur-os-terminal_*_amd64.AppImage

        # Make it executable
        chmod +x muthur-os-terminal_*_amd64.AppImage

        # Run it
        ./muthur-os-terminal_*_amd64.AppImage
        \`\`\`

        ### Debian/Ubuntu (.deb package)
        \`\`\`bash
        # Download and install
        wget https://github.com/krko2n/Muthur-os-terminal/releases/download/$VERSION/muthur-os-terminal_*_amd64.deb
        sudo dpkg -i muthur-os-terminal_*_amd64.deb

        # If dependencies are missing:
        sudo apt install -f
        \`\`\`

        ### Binary (Advanced users)
        \`\`\`bash
        # Download binary
        wget https://github.com/krko2n/Muthur-os-terminal/releases/download/$VERSION/muthur-os-terminal

        # Make it executable
        chmod +x muthur-os-terminal

        # Run it
        ./muthur-os-terminal
        \`\`\`

        ## Verify Download
        \`\`\`bash
        # Download checksums
        wget https://github.com/krko2n/Muthur-os-terminal/releases/download/$VERSION/SHA256SUMS

        # Verify (pick the file you downloaded)
        sha256sum -c SHA256SUMS
        \`\`\`

        ## Requirements
        - Linux (tested on Arch, Ubuntu 22.04+, Debian, Fedora)
        - WebKitGTK 4.1
        - OpenGL/Mesa graphics drivers
        - Ollama (optional, for AI features)

        ## Known Issues
        - WebGL may fail on some systems due to upstream WebKit bug (Issue #6559)
        - Wayland users: may experience minor display quirks (use X11 if issues occur)

        ## What's New
        EOF

        # Append auto-generated notes if available
        if [ -f VERSION_HISTORY.md ]; then
          echo "" >> release-notes.md
          echo "See [VERSION_HISTORY.md](VERSION_HISTORY.md) for detailed changes." >> release-notes.md
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: release-artifacts/*
        body_path: release-notes.md
        draft: false
        prerelease: ${{ contains(needs.build-linux.outputs.version, 'alpha') || contains(needs.build-linux.outputs.version, 'beta') || contains(needs.build-linux.outputs.version, 'rc') }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Release created
      run: |
        echo "Release ${{ needs.build-linux.outputs.version }} created successfully"
        echo "View at: https://github.com/${{ github.repository }}/releases/tag/${{ needs.build-linux.outputs.version }}"
