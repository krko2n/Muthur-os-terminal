name: Build & Release - Multi-Platform

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MUTHUR OS Terminal ${{ github.ref_name }}'
          releaseBody: |
            ## MUTHUR OS Terminal ${{ github.ref_name }}

            ### Installation

            **Linux (AppImage - Recommended)**:
            ```bash
            chmod +x muthur-os-terminal_*_amd64.AppImage
            ./muthur-os-terminal_*_amd64.AppImage
            ```

            **Linux (Debian/Ubuntu)**:
            ```bash
            sudo dpkg -i muthur-os-terminal_*_amd64.deb
            sudo apt install -f
            ```

            **macOS**:
            ```bash
            # Download the .dmg file, open it, and drag to Applications
            ```

            **Windows**:
            ```bash
            # Run the .msi installer or extract the .zip
            ```

            ### Requirements
            - Linux: WebKitGTK 4.1, OpenGL drivers
            - macOS: 10.13 or later
            - Windows: Windows 10 or later
            - Optional: Ollama for AI features

            ### Verify Download
            Check SHA256 checksums to verify integrity.

            See full documentation at: https://github.com/krko2n/Muthur-os-terminal
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
