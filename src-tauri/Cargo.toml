[package]
name = "muthur-os-terminal"
version = "0.1.1"
description = "MUTHUR OS - Advanced terminal interface with AI integration"
authors = ["MUTHUR Development"]
license = "MIT"
repository = "https://github.com/krko2n/Muthur-os-terminal"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["protocol-asset"] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
portable-pty = "0.9"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "rustls-native-certs", "charset", "http2"] }
sysinfo = "0.39"
anyhow = "1.0"
thiserror = "2.0"
toml = "0.8"
scraper = "0.21"
image = "0.25"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
