<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ff41;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#000;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" fill="#000"/>
  <ellipse cx="600" cy="150" rx="500" ry="150" fill="url(#centerGlow)"/>
  <!-- Perspective grid floor -->
  <g stroke="#00ff41" stroke-width="0.4" opacity="0.08">
    <line x1="600" y1="300" x2="0" y2="180"/><line x1="600" y1="300" x2="1200" y2="180"/>
    <line x1="600" y1="300" x2="200" y2="180"/><line x1="600" y1="300" x2="1000" y2="180"/>
    <line x1="600" y1="300" x2="400" y2="180"/><line x1="600" y1="300" x2="800" y2="180"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="260" x2="1200" y2="260"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
  </g>
  <!-- Floating cube -->
  <g transform="translate(600, 100)" filter="url(#glow)">
    <polygon points="0,-55 48,-27.5 48,27.5 0,55 -48,27.5 -48,-27.5" fill="none" stroke="#00ff41" stroke-width="2.5"/>
    <polygon points="0,-36 30,-18 0,0 -30,-18" fill="none" stroke="#00ff41" stroke-width="2" opacity="0.85"/>
    <polygon points="-30,-18 0,0 0,36 -30,18" fill="none" stroke="#00ff41" stroke-width="2" opacity="0.65"/>
    <polygon points="30,-18 0,0 0,36 30,18" fill="none" stroke="#00ff41" stroke-width="2" opacity="0.75"/>
    <g filter="url(#softGlow)">
      <polygon points="0,-12 10,-6 0,0 -10,-6" fill="#00ffff" opacity="0.95"/>
      <polygon points="-10,-6 0,0 0,12 -10,6" fill="#00d4ff" opacity="0.8"/>
      <polygon points="10,-6 0,0 0,12 10,6" fill="#00bcd4" opacity="0.7"/>
    </g>
  </g>
  <!-- Shadow below cube -->
  <ellipse cx="600" cy="165" rx="40" ry="8" fill="#00ff41" opacity="0.05" filter="url(#softGlow)"/>
  <!-- Title -->
  <text x="600" y="210" font-family="'Courier New', monospace" font-size="44" font-weight="bold" fill="#fff" text-anchor="middle" letter-spacing="12">MUTHUR</text>
  <text x="600" y="240" font-family="'Courier New', monospace" font-size="13" fill="#00ff41" text-anchor="middle" letter-spacing="8" filter="url(#glow)">OS TERMINAL</text>
  <text x="600" y="275" font-family="'Courier New', monospace" font-size="10" fill="#555" text-anchor="middle" letter-spacing="3">CINEMATIC LINUX SHELL INTERFACE // v0.1.0</text>
</svg>
