<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <radialGradient id="coreLight" cx="50%" cy="40%" r="40%">
      <stop offset="0%" style="stop-color:#00ff41;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#000;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="coreGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" fill="#000"/>
  <rect width="1200" height="300" fill="url(#coreLight)"/>
  <!-- Circuit traces -->
  <g stroke="#00ff41" stroke-width="0.5" fill="none" opacity="0.1">
    <!-- Left traces -->
    <path d="M 0,150 L 80,150 L 100,130 L 180,130"/>
    <path d="M 0,160 L 60,160 L 80,180 L 160,180"/>
    <path d="M 0,140 L 70,140 L 90,120 L 200,120"/>
    <!-- Right traces -->
    <path d="M 1200,150 L 1120,150 L 1100,130 L 1020,130"/>
    <path d="M 1200,160 L 1140,160 L 1120,180 L 1040,180"/>
    <path d="M 1200,140 L 1130,140 L 1110,120 L 1000,120"/>
    <!-- Trace dots -->
    <circle cx="180" cy="130" r="2" fill="#00ff41" opacity="0.3"/>
    <circle cx="160" cy="180" r="2" fill="#00ff41" opacity="0.3"/>
    <circle cx="200" cy="120" r="2" fill="#00ff41" opacity="0.3"/>
    <circle cx="1020" cy="130" r="2" fill="#00ff41" opacity="0.3"/>
    <circle cx="1040" cy="180" r="2" fill="#00ff41" opacity="0.3"/>
    <circle cx="1000" cy="120" r="2" fill="#00ff41" opacity="0.3"/>
  </g>
  <!-- Large centered cube -->
  <g transform="translate(600, 110)" filter="url(#glow)">
    <polygon points="0,-65 56,-32.5 56,32.5 0,65 -56,32.5 -56,-32.5" fill="none" stroke="#00ff41" stroke-width="2.5"/>
    <!-- Cross struts -->
    <line x1="-56" y1="-32.5" x2="56" y2="32.5" stroke="#00ff41" stroke-width="0.5" opacity="0.3"/>
    <line x1="56" y1="-32.5" x2="-56" y2="32.5" stroke="#00ff41" stroke-width="0.5" opacity="0.3"/>
    <!-- Cube faces -->
    <polygon points="0,-42 36,-21 0,0 -36,-21" fill="none" stroke="#00ff41" stroke-width="2" opacity="0.85"/>
    <polygon points="-36,-21 0,0 0,42 -36,21" fill="none" stroke="#00ff41" stroke-width="2" opacity="0.65"/>
    <polygon points="36,-21 0,0 0,42 36,21" fill="none" stroke="#00ff41" stroke-width="2" opacity="0.75"/>
    <!-- Glowing inner core -->
    <g filter="url(#coreGlow)">
      <polygon points="0,-15 13,-7.5 0,0 -13,-7.5" fill="#00ffff" opacity="1"/>
      <polygon points="-13,-7.5 0,0 0,15 -13,7.5" fill="#00d4ff" opacity="0.85"/>
      <polygon points="13,-7.5 0,0 0,15 13,7.5" fill="#00bcd4" opacity="0.75"/>
    </g>
    <!-- Vertex markers -->
    <circle cx="0" cy="-65" r="3" fill="#00ff41" opacity="0.9"/>
    <circle cx="56" cy="-32.5" r="3" fill="#00ff41" opacity="0.9"/>
    <circle cx="56" cy="32.5" r="3" fill="#00ff41" opacity="0.9"/>
    <circle cx="0" cy="65" r="3" fill="#00ff41" opacity="0.9"/>
    <circle cx="-56" cy="32.5" r="3" fill="#00ff41" opacity="0.9"/>
    <circle cx="-56" cy="-32.5" r="3" fill="#00ff41" opacity="0.9"/>
  </g>
  <!-- Title -->
  <text x="600" y="225" font-family="'Courier New', monospace" font-size="50" font-weight="bold" fill="#00ff41" text-anchor="middle" letter-spacing="18" filter="url(#glow)">MUTHUR</text>
  <!-- Subtitle with decorative dashes -->
  <text x="600" y="258" font-family="'Courier New', monospace" font-size="14" fill="#00d4ff" text-anchor="middle" letter-spacing="6">- - - OS TERMINAL - - -</text>
  <!-- Bottom info -->
  <text x="600" y="288" font-family="'Courier New', monospace" font-size="9" fill="#333" text-anchor="middle" letter-spacing="3">WEYLAND-YUTANI SYSTEMS // INTERFACE 2037 // ALL SYSTEMS NOMINAL</text>
</svg>
