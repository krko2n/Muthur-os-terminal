<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff41"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <!-- Left section with cube -->
  <rect x="0" y="0" width="350" height="300" fill="#0a0a0f"/>
  <!-- Separator -->
  <rect x="350" y="30" width="1" height="240" fill="#00ff41" opacity="0.3"/>
  <!-- Cube in left panel -->
  <g transform="translate(175, 150)" filter="url(#glow)">
    <polygon points="0,-70 61,-35 61,35 0,70 -61,35 -61,-35" fill="none" stroke="#00ff41" stroke-width="2.5"/>
    <polygon points="0,-46 40,-23 0,0 -40,-23" fill="none" stroke="#00ff41" stroke-width="2" opacity="0.8"/>
    <polygon points="-40,-23 0,0 0,46 -40,23" fill="none" stroke="#00ff41" stroke-width="2" opacity="0.6"/>
    <polygon points="40,-23 0,0 0,46 40,23" fill="none" stroke="#00ff41" stroke-width="2" opacity="0.7"/>
    <polygon points="0,-16 14,-8 0,0 -14,-8" fill="#00ffff" opacity="0.9"/>
    <polygon points="-14,-8 0,0 0,16 -14,8" fill="#00b8d4" opacity="0.8"/>
    <polygon points="14,-8 0,0 0,16 14,8" fill="#00acc1" opacity="0.7"/>
    <circle cx="0" cy="-70" r="3" fill="#00ff41" opacity="0.7"/>
    <circle cx="61" cy="-35" r="3" fill="#00ff41" opacity="0.7"/>
    <circle cx="61" cy="35" r="3" fill="#00ff41" opacity="0.7"/>
    <circle cx="0" cy="70" r="3" fill="#00ff41" opacity="0.7"/>
    <circle cx="-61" cy="35" r="3" fill="#00ff41" opacity="0.7"/>
    <circle cx="-61" cy="-35" r="3" fill="#00ff41" opacity="0.7"/>
  </g>
  <!-- Right content -->
  <text x="400" y="90" font-family="'Courier New', monospace" font-size="56" font-weight="bold" fill="url(#titleGrad)" letter-spacing="8" filter="url(#glow)">MUTHUR</text>
  <text x="400" y="125" font-family="'Courier New', monospace" font-size="18" fill="#8b949e" letter-spacing="4">OS TERMINAL</text>
  <!-- Feature list -->
  <g font-family="'Courier New', monospace" font-size="12" fill="#ccc">
    <text x="400" y="165" fill="#00ff41" opacity="0.8">></text><text x="420" y="165">Multi-tab terminal with full PTY</text>
    <text x="400" y="187" fill="#00ff41" opacity="0.8">></text><text x="420" y="187">Real-time system monitoring</text>
    <text x="400" y="209" fill="#00ff41" opacity="0.8">></text><text x="420" y="209">AI-powered command assistance (Ollama)</text>
    <text x="400" y="231" fill="#00ff41" opacity="0.8">></text><text x="420" y="231">3D network globe + file explorer</text>
  </g>
  <!-- Bottom tech line -->
  <line x1="400" y1="255" x2="1100" y2="255" stroke="#333" stroke-width="0.5"/>
  <text x="400" y="278" font-family="'Courier New', monospace" font-size="10" fill="#555" letter-spacing="1">Tauri v2  +  Rust  +  React 19  +  TypeScript  +  Linux  +  18 MB binary</text>
</svg>
