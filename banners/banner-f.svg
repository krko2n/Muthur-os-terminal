<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#010409"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="3" fill="#00ff41" opacity="0.8"/>
  <!-- Logo small, top left area -->
  <g transform="translate(80, 60)" filter="url(#glow)">
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="none" stroke="#00ff41" stroke-width="1.8"/>
    <polygon points="0,-14 12,-7 0,0 -12,-7" fill="none" stroke="#00ff41" stroke-width="1.2" opacity="0.7"/>
    <polygon points="-12,-7 0,0 0,14 -12,7" fill="none" stroke="#00ff41" stroke-width="1.2" opacity="0.5"/>
    <polygon points="12,-7 0,0 0,14 12,7" fill="none" stroke="#00ff41" stroke-width="1.2" opacity="0.6"/>
    <polygon points="0,-5 4,-2.5 0,0 -4,-2.5" fill="#00ffff" opacity="0.9"/>
    <polygon points="-4,-2.5 0,0 0,5 -4,2.5" fill="#00b8d4" opacity="0.7"/>
    <polygon points="4,-2.5 0,0 0,5 4,2.5" fill="#00acc1" opacity="0.6"/>
  </g>
  <!-- Title next to logo -->
  <text x="120" y="67" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#00ff41" letter-spacing="4" filter="url(#glow)">MUTHUR</text>
  <text x="258" y="67" font-family="'Courier New', monospace" font-size="18" fill="#555" letter-spacing="2">OS TERMINAL</text>
  <!-- Large centered text -->
  <text x="600" y="165" font-family="'Segoe UI', 'Helvetica Neue', sans-serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="300">Cinematic Fullscreen Terminal for Linux</text>
  <text x="600" y="205" font-family="'Courier New', monospace" font-size="13" fill="#8b949e" text-anchor="middle">Real PTY sessions. Live system monitoring. AI-powered commands. Desktop replacement.</text>
  <!-- Tech pills -->
  <g font-family="'Courier New', monospace" font-size="10" text-anchor="middle">
    <rect x="330" y="235" width="70" height="22" rx="11" fill="none" stroke="#e44d26" stroke-width="1" opacity="0.6"/>
    <text x="365" y="250" fill="#e44d26" opacity="0.8">Rust</text>
    <rect x="420" y="235" width="80" height="22" rx="11" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
    <text x="460" y="250" fill="#00d4ff" opacity="0.8">Tauri v2</text>
    <rect x="520" y="235" width="80" height="22" rx="11" fill="none" stroke="#61dafb" stroke-width="1" opacity="0.6"/>
    <text x="560" y="250" fill="#61dafb" opacity="0.8">React 19</text>
    <rect x="620" y="235" width="90" height="22" rx="11" fill="none" stroke="#3178C6" stroke-width="1" opacity="0.6"/>
    <text x="665" y="250" fill="#3178C6" opacity="0.8">TypeScript</text>
    <rect x="730" y="235" width="70" height="22" rx="11" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.6"/>
    <text x="765" y="250" fill="#a855f7" opacity="0.8">Ollama</text>
    <rect x="820" y="235" width="60" height="22" rx="11" fill="none" stroke="#FFC131" stroke-width="1" opacity="0.6"/>
    <text x="850" y="250" fill="#FFC131" opacity="0.8">Linux</text>
  </g>
  <!-- Version bottom right -->
  <text x="1150" y="285" font-family="'Courier New', monospace" font-size="10" fill="#444" text-anchor="end">v0.1.0-alpha</text>
</svg>
